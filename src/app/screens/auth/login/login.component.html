<div class="login-page">
  <aside class="left-panel">
    <div class="branding">
      <h1>Access control, simplified.</h1>
      <p>A focused platform for managing users, roles, permissions and connected applications.</p>
    </div>
  </aside>

  <main class="login-container">
    <div class="form-section">
      <section class="login-card">
        <div class="logo-wrapper"><img src="assets/images/diplogo-white.png" alt="Ennoble IP logo"></div>
        <h2 class="login-title">Sign in</h2>
        <p class="login-subtitle">Continue to the User Management System</p>

        <form #loginForm="ngForm" class="login-form">
          <label for="login-email">Email address</label>
          <div class="input-group">
            <i class="bi bi-envelope"></i>
            <input id="login-email" type="text" [(ngModel)]="emailId" name="username" placeholder="name@company.com" required #email="ngModel">
          </div>

          <label for="login-password">Password</label>
          <div class="input-group">
            <i class="bi bi-lock"></i>
            <input id="login-password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="Enter your password" required #passwordField="ngModel">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'" (click)="showPassword = !showPassword"></i>
          </div>

          <div class="forgot-password">
            <a (click)="onForgotPassword()"><i class="bi bi-key"></i> Forgot your password?</a>
          </div>
          <button type="submit" class="btn submit" [disabled]="!loginForm.valid" (click)="onSignIn()">Continue securely <i class="bi bi-arrow-right"></i></button>

          <div class="or-divider">Alternative sign in</div>
          <div class="social-login">
            <button type="button" class="btn microsoft"><i class="bi bi-microsoft me-2"></i>Microsoft</button>
            <button type="button" class="btn google"><i class="bi bi-google me-2"></i>Google</button>
          </div>
          <p class="redirect">New to the platform? <a routerLink="/auth/signup">Create account</a></p>
        </form>
      </section>
    </div>
  </main>
  <app-loader *ngIf="loadSpinner"></app-loader>
</div>
