<div class="verification-page">
  <aside class="verification-aside">
    <img src="../../../assets/images/diplogo-white.png" class="full-logo" alt="Ennoble IP logo">
    <div><span>Identity check</span><h1>One last step to keep your account secure.</h1><p>Enter the one-time code sent to your registered email address.</p></div>
    <small>ENNOBLE IP · USER MANAGEMENT</small>
  </aside>
  <main class="verification-main">
    <div class="verification-card">
      <div class="step-label">SECURE VERIFICATION</div>
      <h2>Verify OTP</h2>
      <p class="helper">Use the verification code to continue.</p>
      <div class="input-field-login">
        <label>Verification code</label>
        <input class="form-control" (keypress)="validateNo($event)" placeholder="Enter OTP" [(ngModel)]="otp">
      </div>
      <div *ngIf="isForgetPasswordFlow && enterPassword" class="input-field-login position-relative">
        <label>New password</label>
        <input [type]="showNewPassword ? 'text' : 'password'" class="form-control" placeholder="Enter new password" [(ngModel)]="newPassword">
        <img src="assets/images/icons/viewPassword.svg" alt="Toggle password" (click)="showNewPassword = !showNewPassword" class="password-toggle">
      </div>
      <button (click)="submit()" [disabled]="!otp" type="button" class="password-button">Verify and continue</button>
      <div class="verification-meta">
        <p class="time">Code expires in {{ minutes }}:{{ seconds | number: '2.0' }}</p>
        <button type="button" class="resend-otp-button" [disabled]="!enableResend" (click)="resendOtp()">Resend code</button>
      </div>
      <button class="back-link" (click)="onBackSignUp()"><i class="bi bi-arrow-left"></i> Go back</button>
    </div>
  </main>
</div>
