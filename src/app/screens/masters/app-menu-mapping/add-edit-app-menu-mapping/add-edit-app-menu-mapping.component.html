<div class="page-title">
  <h1 class="screen-heading">{{ menuId ? 'Edit' : 'Create' }} App Menu Mapping</h1>
  <div class="d-flex gap-2 mt-2">
    <button class="lift-btn me-2" (click)="onSubmit()">Save</button>
    <button class="lift-btn-info me-2" (click)="addMenu()" [disabled]="!appData" *ngIf="!menuId">+ Add Menu</button>
    <button class="lift-btn-cancel me-2" (click)="onCancel()"><i class="bi bi-x-circle-fill me-1"></i>Cancel</button>
  </div>
</div>
<div class="menu-container">
  <form [formGroup]="menuForm">
    <div class="row application-details-section">
      <div class="menu-heading mb-3">
        Application Details
      </div>
      <div class="col-3">
        <div class="custom-form-input">
          <label>App Name<span class="text-danger">*</span></label>
          <ng-select class="input-field" formControlName="appName" placeholder="Select App Name" [readonly]="menuId"
            (change)="onAppChange($event)">
            <ng-option *ngFor="let app of appsData" [value]="app.value">{{ app.value }}</ng-option>
          </ng-select>
        </div>
      </div>
      <div class="col-3" *ngIf="menuId">
        <div class="custom-form-input">
          <label>Status<span class="text-danger">*</span></label>
          <ng-select class="input-field" formControlName="status" placeholder="Select Status">
            <ng-option *ngFor="let status of statusOptions" [value]="status">{{ status }}</ng-option>
          </ng-select>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-between menu-details-header" *ngIf="menus().length">
      <div class="menu-heading">
        Menu Details
      </div>
    </div>


    <div class="row menus-layout" formArrayName="menu">
      <div *ngFor="let menu of menus().controls; let i = index" [formGroupName]="i"
        class="menu-card">
        <div class="row align-items-center menu-card-header">
          <div class="col-6">
            <h5>Menu {{ i + 1 }}</h5>
          </div>
          <div class="col-6 text-end">
            <!-- <button type="button" class="custom-button-regulr" [ngbPopover]="popContent" [autoClose]="'outside'"
              triggers="manual" #p="ngbPopover" (click)="p.open()" [disabled]="!isMenuName(i)">
              Add Sub Menu
            </button>
            <ng-template #popContent>
              <div class="custom-form-input">
                <input type="text" placeholder="Number of sub menus" #subMenu>
              </div>
              <button class="custom-button-filters" (click)="p.close(); addSubMenu(subMenu.value, i)">
                Add
              </button>
            </ng-template> -->

            <!-- Alternate of NGBpopover -->
            <div class="position-relative d-inline-block" [ngClass]="{'disabled-wrapper': !isMenuName(i)}">
              <button type="button" class="custom-button-regulr" (click)="toggleSubmenuInput(i)"
                [disabled]="!isMenuName(i)">
                Add Sub Menu
              </button>
              <div *ngIf="submenuInputVisible[i]"
                class="submenu-input-box shadow-sm p-2 bg-white border rounded position-absolute"
                style="right: 0; z-index: 100;">
                <div class="custom-form-input">
                  <input type="number" min="1" [formControl]="submenuCountControls[i]" class="form-control"
                    placeholder="Number of submenus" />
                </div>
                <div class="mt-2 text-end">
                  <button class="btn btn-sm btn-primary"
                    (click)="addSubMenu(submenuCountControls[i].value, i); toggleSubmenuInput(i)">
                    Add
                  </button>
                </div>
              </div>
            </div>
            <!-- End of alternate of ngbPopover -->

            <!-- Delete icon for Menu -->
            <button type="button" class="btn btn-danger btn-sm ms-2" (click)="removeMenu(i)" *ngIf="!menuId">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <!-- Menu Fields -->
        <div class="row menu-fields-grid">
          <div class="col-lg-3">
            <div class="custom-form-input">
              <label>Menu Name<span class="text-danger">*</span></label>
              <input type="text" class="input-field" formControlName="menuName" (input)="formatMenuName($event, i)">
            </div>
          </div>
          <div class="col-lg-3">
            <div class="custom-form-input">
              <label>Routing<span class="text-danger">*</span></label>
              <input type="text" class="input-field" formControlName="routing">
            </div>
          </div>
          <div class="col-lg-3">
            <div class="custom-form-input">
              <label>Description</label>
              <input type="text" class="input-field" formControlName="description">
            </div>
          </div>
          <div class="col-lg-3">
            <div class="custom-form-input">
              <label>Order By<span class="text-danger">*</span></label>
              <input type="text" (keypress)="validateNo($event)" formControlName="orderBy">
            </div>
          </div>
          <div class="col-lg-3">
            <div class="custom-form-input">
              <label>Level<span class="text-danger">*</span></label>
              <input type="text" (keypress)="validateNo($event)" formControlName="level">
            </div>
          </div>
          <div class="col-lg-3">
            <div class="custom-form-input">
              <label>Permissions</label>
              <ng-multiselect-dropdown [settings]="permissionDropdown" [data]="permissionData"
                formControlName="permissions">
              </ng-multiselect-dropdown>
            </div>
          </div>
        </div>

        <!-- Submenu Section -->
        <div *ngIf="subMenus(i).length > 0" formArrayName="subMenu" class="submenu-section">
          <h6 class="submenu-title">Sub Menus</h6>
          <div *ngIf="subMenus(i) as subMenuArray">
            <div *ngFor="let _subSubMenu of subMenuArray.controls; let j = index" [formGroupName]="j"
              class="submenu-item">
              <div class="submenu-item-header">
                <span>Sub Menu {{i+1}}.{{j+1}}</span>
              </div>
              <div class="row submenu-fields-grid">
                <div class="col-lg-3">
                  <div class="custom-form-input">
                    <label>Name<span class="text-danger">*</span></label>
                    <input type="text" formControlName="menuName" [value]="getPrefilledSubmenuName(i, j)"
                      (input)="updateSubmenuName($event, i, j)" />
                  </div>
                </div>

                <div class="col-lg-3">
                  <div class="custom-form-input">
                    <label>Routing<span class="text-danger">*</span></label>
                    <input formControlName="routing">
                  </div>
                </div>
                <div class="col-lg-3">
                  <div class="custom-form-input">
                    <label>Description</label>
                    <input formControlName="description">
                  </div>
                </div>
                <div class="col-lg-3">
                  <div class="custom-form-input">
                    <label>Order By<span class="text-danger">*</span></label>
                    <input type="text" formControlName="orderBy" (keypress)="validateNo($event)">
                  </div>
                </div>
                <div class="col-lg-3">
                  <div class="custom-form-input">
                    <label>Level<span class="text-danger">*</span></label>
                    <input type="text" formControlName="level" (keypress)="validateNo($event)">
                  </div>
                </div>
                <div class="col-lg-3">
                  <div class="custom-form-input">
                    <label>Permissions</label>
                    <ng-multiselect-dropdown [settings]="permissionDropdown" [data]="permissionData"
                      formControlName="permissions">
                    </ng-multiselect-dropdown>
                  </div>
                </div>
                <div class="col-3" *ngIf="menuId">
                  <div class="custom-form-input">
                    <label>Status</label>
                    <ng-select class="input-field" formControlName="status" placeholder="Select Status">
                      <ng-option *ngFor="let status of statusOptions" [value]="status">{{ status }}</ng-option>
                    </ng-select>
                  </div>
                </div>
              </div>
              <div class="text-end">
                <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeSubMenu(i, j)"
                  *ngIf="!menuId">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </form>
</div>

<app-loader *ngIf="loadSpinner"></app-loader>
